<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile Preview — The Data Company</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background:#e8eaee; font-family:-apple-system,sans-serif; padding:28px; display:flex; gap:32px; align-items:flex-start; flex-wrap:wrap; }
  .phone { width:390px; border:1px solid #2c3644; border-radius:28px; overflow:hidden; box-shadow:0 20px 50px rgba(28,44,68,.18); flex:none; }
  .phone .bar { background:#2c3644; color:#fff; font-size:12px; letter-spacing:.14em; text-transform:uppercase; padding:8px 14px; display:flex; justify-content:space-between; }
  .phone iframe { width:390px; height:760px; border:0; display:block; background:#fff; }
</style>
</head>
<body>
  <div class="phone"><div class="bar"><span>390px</span><span>index.html</span></div><iframe src="index.html"></iframe></div>
  <div class="phone"><div class="bar"><span>390px</span><span>quote.html</span></div><iframe src="quote.html"></iframe></div>
</body>
</html>
